[package]
name = "gnosis"
version = "0.1.0"
edition = "2024"
publish = false
description = "A small, Git-backed OKF package manager"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
tempfile = "3"
toml = "0.9"
