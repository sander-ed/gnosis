[package]
name = "gnosis"
version = "0.3.3"
edition = "2024"
publish = false
description = "A small, Git-backed OKF package manager"
license = "MIT"
repository = "https://github.com/sander-ed/gnosis"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
tempfile = "3"
toml = "0.9"

# Full-speed optimisation (opt-level 3) with a smaller binary.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
